<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZETA — Discord Bot</title><link rel="icon" href="/dashboard/images/logo.png"><link rel="stylesheet" href="/dashboard/css/style.css"><style>
