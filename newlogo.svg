<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#132621"/>
      <stop offset="100%" stop-color="#030705"/>
    </radialGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E6AC"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6B1F"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAB0"/>
      <stop offset="100%" stop-color="#0F7A54"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#vGrad)" stroke-width="5" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#vGrad)" stroke-opacity="0.25" stroke-width="1.5"/>

  <g filter="url(#soft)">
    <!-- two clean, clearly-shaped leaves flanking the letter -->
    <g transform="translate(150,238) rotate(-30)">
      <path d="M0,0 C 20,-26 52,-30 74,-14 C 52,-10 32,2 20,20 C 10,10 2,4 0,0 Z" fill="url(#leafGrad)"/>
      <path d="M4,-2 C 24,-16 48,-20 68,-14" stroke="#062018" stroke-width="2.5" fill="none" opacity="0.5"/>
    </g>
    <g transform="translate(362,238) rotate(30) scale(-1,1)">
      <path d="M0,0 C 20,-26 52,-30 74,-14 C 52,-10 32,2 20,20 C 10,10 2,4 0,0 Z" fill="url(#leafGrad)"/>
      <path d="M4,-2 C 24,-16 48,-20 68,-14" stroke="#062018" stroke-width="2.5" fill="none" opacity="0.5"/>
    </g>

    <!-- ornate serif V -->
    <text x="256" y="332" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="212" fill="url(#vGrad)" style="font-style:italic;">V</text>
  </g>
</svg>
